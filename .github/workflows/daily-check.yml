name: Daily firmware check

on:
  schedule:
    # Once every 24h. GitHub Actions cron runs in UTC and schedules can slip
    # a few minutes under load - "once a day" is the guarantee, not an exact
    # time of day.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      slack_test:
        description: "Only send a test Slack message (skips the firmware checks and the commit)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Manual "Run workflow" with slack_test ticked: posts one labelled test
  # message with the real secrets and stops - for confirming a new webhook /
  # alert recipient. Fails the run (red) if Slack rejects it.
  slack-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.slack_test }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Send test messages (updates channel + alerts channel)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          SLACK_ALERT_USER_ID: ${{ secrets.SLACK_ALERT_USER_ID }}
        run: python scripts/slack_test.py
      - name: Send a sample "daily run failed" alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          SLACK_ALERT_USER_ID: ${{ secrets.SLACK_ALERT_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/notify_run_failed.sh --test

  check:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.slack_test) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run firmware checks
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          SLACK_ALERT_USER_ID: ${{ secrets.SLACK_ALERT_USER_ID }}
        run: python scripts/ci_check.py

      - name: Build static site
        run: python scripts/build_static.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/equipment.json public
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated firmware check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # main can move during the run (someone pushing, or an earlier
            # run finishing) - sync first so an unrelated commit doesn't
            # reject our push and fail the whole run. A genuine conflict (the
            # same file changed on both sides) still fails here, loudly,
            # rather than overwriting anything.
            git pull --rebase origin main
            git push
          fi

      # Only runs if an earlier step failed - see scripts/notify_run_failed.sh
      # for why it's curl + jq rather than the Python Slack code, and for where
      # it posts (the alerts channel, falling back to the main one).
      - name: Notify Slack if the run failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          SLACK_ALERT_USER_ID: ${{ secrets.SLACK_ALERT_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/notify_run_failed.sh
